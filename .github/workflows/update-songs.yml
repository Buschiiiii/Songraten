# Holt neue Songs fuer den Jahrzehnte- und Genremodus und committet sie.
#
# Warum ueberhaupt automatisch: die Titelsuche bei Apple braucht viele
# Anfragen, und Apple drosselt nach einigen hundert. Ueber mehrere Laeufe
# verteilt faellt das nicht auf - der Cache im Repo-Cache haelt fest, was
# schon gefragt wurde.
#
# Der Lauf laesst sich jederzeit von Hand starten:
#   Repo -> Actions -> "Songs aktualisieren" -> Run workflow

name: Songs aktualisieren

on:
  schedule:
    # Taeglich statt monatlich: Apple laesst aus GitHubs Rechenzentren nur
    # wenige Anfragen pro Lauf durch (beim ersten Lauf 56 in 17 Minuten).
    # Ueber viele kleine Laeufe kommt trotzdem etwas zusammen.
    - cron: '17 4 * * *'      # taeglich um 4:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Sekunden fuer die Titelsuche bei Apple'
        default: '1500'
      region_seconds:
        description: 'Sekunden fuer die Laender-Hits bei Apple'
        default: '900'

permissions:
  contents: write

concurrency:
  group: songs-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Gefundene Titel und geladene Wikipedia-Seiten ueberleben so den Lauf.
      # Getrennt, weil `actions/cache` erst im Post-Schritt sichert - und der
      # faellt bei einem fehlgeschlagenen Job aus. Die Titelsuchen dieses
      # Laufs waeren dann umsonst gewesen.
      - name: Cache holen
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: songraten-cache-${{ github.run_id }}
          restore-keys: songraten-cache-

      - name: Pipeline pruefen
        run: python3 tools/test_pipeline.py

      - name: Jahrescharts von Wikipedia
        run: python3 tools/fetch_yearcharts.py

      - name: Titel bei Apple suchen
        run: python3 tools/add_decades.py ${{ github.event.inputs.seconds || 1500 }}

      # Was nur in einem Land gross war (deutscher Rap, Schlager, franzoesischer
      # Pop), steht nicht in kworbs Weltliste. Die obersten 400 je Land, die
      # fehlen, bei Apple suchen - ueber viele Tage, wie die Jahrescharts.
      - name: Laender-Hits bei Apple suchen
        continue-on-error: true
        run: python3 tools/add_regional.py ${{ github.event.inputs.region_seconds || 900 }}

      # Hits, die als Schlaflied- oder Klavier-Cover in songs.json stehen
      # („See You Again" als Spieluhr), gegen das Original tauschen. Vor dem
      # Zusammenfuehren: gibt es das Original schon, verschmilzt es danach.
      - name: Cover gegen Originale tauschen
        continue-on-error: true
        run: python3 tools/fix_covers.py 300

      - name: Doppelte zusammenfuehren
        run: python3 tools/clean_songs.py

      # Streams je Land: kworb fuehrt die Spotify-Wochencharts fuer jedes
      # Land; die Summen landen als `rc` in songs.json. Daran haengen der
      # Modus „Laender-Charts" und im Sprachfilter die Frage, ob ein
      # spanischer Song in einem Land ein bekannter Hit ist (Despacito).
      # Eine Anfrage je Land. Ein Land, das nicht kommt, behaelt seine alten
      # Zahlen; kommt keins, bleibt die Datei, wie sie war.
      - name: Streams je Land
        continue-on-error: true
        run: python3 tools/fetch_regions.py

      # Lieber nichts committen als eine halbe Datei ausliefern: die Seite
      # bleibt weiss, wenn songs.json kaputt ist.
      - name: Gefundene Titel sichern
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: songraten-cache-${{ github.run_id }}

      - name: Datei pruefen
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          d = json.load(open('data/songs.json', encoding='utf-8'))
          songs = d['songs']
          assert len(songs) >= 1900, f'nur {len(songs)} Songs - das kann nicht stimmen'
          assert all(s.get('p') and s.get('t') for s in songs), 'Songs ohne Titel oder Preview'
          alt = subprocess.run(['git', 'show', 'HEAD:data/songs.json'],
                               capture_output=True, text=True).stdout
          vorher = len(json.loads(alt)['songs']) if alt else 0
          assert len(songs) >= vorher, f'{vorher} -> {len(songs)} Songs, es wurden welche verloren'
          print(f'{vorher} -> {len(songs)} Songs')
          PY

      - name: Committen
        run: |
          # --porcelain statt diff: beim ersten Lauf ist data/yearcharts.json
          # neu, und git diff sieht unbekannte Dateien nicht.
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "nichts Neues"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "Songs aktualisiert ($(date +%Y-%m-%d))"
          # Falls in der Zwischenzeit etwas anderes gepusht wurde
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
