# Baut den Chartsbestand komplett neu: Streamzahlen von kworb, Titel und
# Previews von Apple. Laeuft nur auf Knopfdruck, weil dabei die ganze
# songs.json neu entsteht - der monatliche Lauf (update-songs.yml) haengt
# dagegen nur neue Jahrzehnt-Songs an.
#
#   Repo -> Actions -> "Charts neu bauen" -> Run workflow
#
# Der Lauf braucht lange: kworb liefert ~700 Kuenstlerseiten, danach will
# Apple fuer jeden Kuenstler einen Katalog liefern und drosselt dabei. Kommt
# zu wenig zusammen, wird nichts committet und die alte Datei bleibt stehen.

name: Charts neu bauen

on:
  workflow_dispatch:
    inputs:
      artists:
        description: 'Wie viele Kuenstler von kworb'
        default: '700'
      catalog_seconds:
        description: 'Sekunden fuer die Kataloge bei Apple'
        # 45 statt 30 Minuten: mit kworb (12) und add_decades (10) bleibt das
        # unter dem Timeout von 90, und je mehr Kataloge ein Lauf schafft,
        # desto eher kommt der Bestand vollstaendig zusammen.
        default: '2700'

permissions:
  contents: write

concurrency:
  group: songs-data
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Bewusst restore und save getrennt: `actions/cache` sichert erst im
      # Post-Schritt, und der wird bei einem fehlgeschlagenen Job
      # uebersprungen. Genau das ist passiert - ein Lauf holte 30 Minuten
      # lang Kataloge, scheiterte danach an der Pruefung und warf sie weg.
      # Der naechste Lauf fing wieder bei null an und scheiterte genauso.
      - name: Cache holen
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache
            catalogs
          key: songraten-charts-${{ github.run_id }}
          restore-keys: songraten-charts-

      - name: Pipeline pruefen
        run: python3 tools/test_pipeline.py

      - name: Streamzahlen von kworb
        run: python3 tools/fetch_kworb.py ${{ github.event.inputs.artists || 700 }}

      - name: Kataloge von Apple
        run: python3 tools/fetch_catalogs.py ${{ github.event.inputs.catalog_seconds || 1800 }}

      - name: songs.json bauen
        run: python3 tools/match_local.py

      # Der Neubau kennt die per add_decades geholten Songs nicht - die
      # stehen aber noch in der alten Datei und werden von dort uebernommen.
      # Sie neu zu suchen kostet je Song eine Anfrage bei Apple, und davon
      # kaeme aus GitHubs Rechenzentren nur ein Bruchteil zurueck.
      - name: Jahrzehnte aus der alten Datei uebernehmen
        run: python3 tools/keep_extras.py

      # Und danach noch holen, was seitdem dazugekommen ist.
      - name: Jahrzehnte nachlegen
        run: python3 tools/add_decades.py 600

      - name: Doppelte zusammenfuehren
        run: python3 tools/clean_songs.py

      # Vor der Pruefung, und mit always(): auch ein Lauf, der am Ende nichts
      # committen darf, soll seine Kataloge dalassen. So kommt der Bestand
      # ueber mehrere Laeufe zusammen, statt bei jedem Versuch zu verpuffen.
      - name: Kataloge sichern
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            .cache
            catalogs
          key: songraten-charts-${{ github.run_id }}

      - name: Datei pruefen
        run: |
          python3 - <<'PY'
          import json, subprocess
          d = json.load(open('data/songs.json', encoding='utf-8'))
          songs = d['songs']
          mit_stufe = [s for s in songs if s.get('d')]
          assert len(songs) >= 1900, f'nur {len(songs)} Songs'
          assert all(s.get('p') and s.get('t') for s in songs), 'Songs ohne Titel oder Preview'
          assert all(s.get('ar') is not None for s in songs), 'Songs ohne Kuenstler-IDs'
          for tier in d['tiers']:
              n = sum(1 for s in songs if s.get('d') == tier)
              assert n >= 150, f'Stufe {tier} hat nur {n} Songs'

          alt = subprocess.run(['git', 'show', 'HEAD:data/songs.json'],
                               capture_output=True, text=True).stdout
          frueher = json.loads(alt)['songs'] if alt else []
          vorher_stufe = sum(1 for s in frueher if s.get('d'))
          # Ein gedrosselter Lauf holt weniger Kataloge und verliert dadurch
          # Chartsongs - dann lieber nichts committen. Ein Prozent Schwankung
          # ist normal, mehr nicht.
          assert len(mit_stufe) >= vorher_stufe * 0.99, (
              f'{vorher_stufe} -> {len(mit_stufe)} Songs mit Stufe: der Lauf hat welche verloren, '
              'vermutlich fehlen Kataloge. Nichts committet.')
          # Dasselbe fuer den Gesamtbestand: die Jahrzehnt-Songs sind ueber
          # Wochen zusammengekommen, ein Neubau darf sie nicht wegwerfen.
          assert len(songs) >= len(frueher) * 0.99, (
              f'{len(frueher)} -> {len(songs)} Songs insgesamt: der Lauf hat welche verloren. '
              'Nichts committet.')
          print(f'{len(frueher)} -> {len(songs)} Songs, davon {vorher_stufe} -> {len(mit_stufe)} mit Stufe')
          PY

      - name: Committen
        run: |
          # --porcelain statt diff: beim ersten Lauf ist data/yearcharts.json
          # neu, und git diff sieht unbekannte Dateien nicht.
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "nichts Neues"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "Charts neu gebaut ($(date +%Y-%m-%d))"
          # Falls in der Zwischenzeit etwas anderes gepusht wurde
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
